# Throwaway Postgres, Valkey and Durable Streams for `bun run --cwd packages/server test`: in
# memory, fixed test credentials, own ports and project name, so tests never touch development
# data. It is a separate file rather than a profile of docker-compose.yml because that file
# requires real secrets for every command.
#
#   docker compose -f docker-compose.test.yml up -d --wait --build
#   docker compose -f docker-compose.test.yml down
name: radium-test

services:
  postgres:
    image: postgres:18.7-alpine
    # Durability is pointless for a throwaway database; these make tests faster.
    command:
      ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: radium
      POSTGRES_PASSWORD: radium-test
      POSTGRES_DB: radium
    tmpfs: [/var/lib/postgresql]
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "radium", "-d", "radium"]
      interval: 1s
      retries: 30

  valkey:
    image: valkey/valkey:9.2-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      retries: 30

  # The image the deployment runs (docker/durable-streams), with its data directory in memory.
  # Distroless has no shell for a healthcheck; tests retry their first request instead.
  streams:
    build: docker/durable-streams
    image: radium-durable-streams:0.3.0
    environment:
      STREAMS_TOKEN: radium-test-streams
    tmpfs: ["/data:uid=65532,gid=65532,mode=0700"]
    ports: ["127.0.0.1:54437:4437"]
