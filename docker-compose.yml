services:
  radium:
    build:
      context: packages/website
      dockerfile: Dockerfile
      args:
        VITE_CONVEX_URL: ${VITE_CONVEX_URL:-http://localhost:3210}
        VITE_CONVEX_SITE_URL: ${VITE_CONVEX_SITE_URL:-http://localhost:3211}
    image: radium:local
    ports:
      - "${PORT:-3000}:3000"
      - "${CONVEX_PORT:-3210}:3210"
      - "${CONVEX_SITE_PORT:-3211}:3211"
    volumes:
      - convex-data:/convex/data
    environment:
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      SECRET_STORE_KEYS: ${SECRET_STORE_KEYS:?Set SECRET_STORE_KEYS to 1:<base64-32-byte-key>}
      Openrouter_API_Key: ${Openrouter_API_Key:-}
      AISDK_MaxRetries: ${AISDK_MaxRetries:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-radium-gateway}
      INSTANCE_NAME: ${INSTANCE_NAME:-}
      INSTANCE_SECRET: ${INSTANCE_SECRET:-}
      CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN:-http://localhost:3210}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:-http://localhost:3211}
      CONVEX_URL: ${CONVEX_URL:-http://localhost:3210}
      CONVEX_SITE_URL: ${CONVEX_SITE_URL:-http://localhost:3211}
      VITE_CONVEX_URL: ${VITE_CONVEX_URL:-http://localhost:3210}
      VITE_CONVEX_SITE_URL: ${VITE_CONVEX_SITE_URL:-http://localhost:3211}
      DISABLE_BEACON: ${DISABLE_BEACON:-}
      RUST_LOG: ${RUST_LOG:-info}
    restart: unless-stopped

volumes:
  convex-data:
